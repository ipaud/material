appId: com.pauavila.material
productName: MATERIAL
afterPack: scripts/after-pack.mjs
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/dock
    to: dock
mac:
  category: public.app-category.graphics-design
  extendInfo:
    NSCameraUsageDescription: >-
      MATERIAL uses the camera as a live visual source when you enable
      Camera.
  target:
    - target: dir
      arch: [arm64]
  # Ad-hoc signing: leaving this null keeps Electron's own linker signature
  # on the renamed bundle (Identifier=Electron, Sealed Resources=none), which
  # fails `codesign --verify --strict`. Hardened runtime stays off because
  # ad-hoc + hardened trips macOS library validation; it is only needed for
  # notarized distribution.
  identity: '-'
  hardenedRuntime: false
npmRebuild: false
