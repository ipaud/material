appId: com.pauavila.material
productName: MATERIAL
afterPack: scripts/after-pack.mjs
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/dock
    to: dock
mac:
  category: public.app-category.graphics-design
  extendInfo:
    NSCameraUsageDescription: >-
      MATERIAL uses the camera as a live visual source when you enable
      Camera.
  target:
    - target: dir
      arch: [arm64]
  # Ad-hoc signing: leaving this null keeps Electron's own linker signature
  # on the renamed bundle (Identifier=Electron, Sealed Resources=none), which
  # fails `codesign --verify --strict`. Hardened runtime stays off because
  # ad-hoc + hardened trips macOS library validation; it is only needed for
  # notarized distribution.
  identity: '-'
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  # Not code-signed: Windows SmartScreen shows "Windows protected your PC" until the app has reputation.
  # Chosen on purpose; the release notes say how to open it.
  signAndEditExecutable: false
  artifactName: MATERIAL-${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: MATERIAL-${version}-win-x64-setup.${ext}
npmRebuild: false
